<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">PHP Safe Migrateの診断フロー</title>
  <desc id="desc">設定の静的診断、PHP公式情報との照合、移行先候補、隔離検証と人による承認。本番環境の変更は行いません。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a1225"/><stop offset="1" stop-color="#122b39"/></linearGradient>
    <linearGradient id="accent" x2="1"><stop stop-color="#39d8a7"/><stop offset="1" stop-color="#86efd0"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".24"/></filter>
  </defs>
  <rect width="1200" height="480" rx="28" fill="url(#bg)"/>
  <circle cx="1100" cy="30" r="180" fill="#39d8a7" opacity=".055"/>
  <circle cx="70" cy="455" r="150" fill="#76a7ff" opacity=".06"/>
  <rect x="52" y="45" width="56" height="56" rx="16" fill="url(#accent)"/>
  <path d="M68 72h24M68 81h16" stroke="#0a2130" stroke-width="5" stroke-linecap="round"/>
  <text x="127" y="79" fill="#f2fcff" font-family="Hiragino Sans, Noto Sans JP, Meiryo, sans-serif" font-size="32" font-weight="700">PHP Safe Migrate</text>
  <text x="52" y="137" fill="#b3c7d0" font-family="Hiragino Sans, Noto Sans JP, Meiryo, sans-serif" font-size="19">変更の前に根拠を。PHPのまま移行。</text>
  <g filter="url(#shadow)">
    <rect x="52" y="185" width="246" height="168" rx="20" fill="#182b3d" stroke="#2b4b58"/>
    <rect x="336" y="185" width="246" height="168" rx="20" fill="#182b3d" stroke="#2b4b58"/>
    <rect x="620" y="185" width="246" height="168" rx="20" fill="#182b3d" stroke="#2b4b58"/>
    <rect x="904" y="185" width="246" height="168" rx="20" fill="#182b3d" stroke="#2b4b58"/>
  </g>
  <g fill="#39d8a7" font-family="Hiragino Sans, Noto Sans JP, Meiryo, sans-serif" font-size="16" font-weight="700">
    <text x="74" y="219">01 / 現状把握</text><text x="358" y="219">02 / 照合</text><text x="642" y="219">03 / 候補提示</text><text x="926" y="219">04 / 今後</text>
  </g>
  <g fill="#f2fcff" font-family="Hiragino Sans, Noto Sans JP, Meiryo, sans-serif" font-size="24" font-weight="700">
    <text x="74" y="261">宣言されたPHP</text><text x="358" y="261">CVE・EOL</text><text x="642" y="261">移行先候補</text><text x="926" y="261">人による判断</text>
  </g>
  <g fill="#b3c7d0" font-family="Hiragino Sans, Noto Sans JP, Meiryo, sans-serif" font-size="16">
    <text x="74" y="298">Docker・Composer</text><text x="74" y="323">読み取り専用</text>
    <text x="358" y="298">PHP公式情報</text><text x="358" y="323">未確認を明示</text>
    <text x="642" y="298">静的な制約のみ</text><text x="642" y="323">互換性は未保証</text>
    <text x="926" y="298">隔離テスト・バックアップ</text><text x="926" y="323">明示的な承認</text>
  </g>
  <g stroke="#39d8a7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M305 270h20m-8-8 8 8-8 8"/><path d="M589 270h20m-8-8 8 8-8 8"/><path d="M873 270h20m-8-8 8 8-8 8"/>
  </g>
  <rect x="52" y="387" width="1098" height="54" rx="15" fill="#0e2031" stroke="#2b4b58"/>
  <circle cx="78" cy="414" r="7" fill="#f8c66a"/>
  <text x="98" y="421" fill="#d8e8ec" font-family="Hiragino Sans, Noto Sans JP, Meiryo, sans-serif" font-size="17">現行版は静的診断のみ。本番環境を変更しません</text>
</svg>
