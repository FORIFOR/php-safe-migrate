[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "php-safe-migrate"
version = "0.4.0"
description = "Fail-closed PHP runtime migration assessment"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
php-safe-migrate = "phpsafe.cli:main"
php-safe-migrate-verify = "phpsafe.verify_cli:main"
php-safe-migrate-url = "phpsafe.url_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phpsafe = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501", "S101"]
